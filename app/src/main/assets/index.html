var EXT=[['Sentadilla búlgara',3,'8–12','90–120 s','Pie de atrás sobre un banco, mancuernas a los lados. Baja con el torso levemente inclinado y la rodilla de adelante alineada con el pie. Primero una pierna y luego la otra.',1],['Hip thrust con barra',3,'8–12','90–120 s','Espalda alta apoyada en un banco firme y la barra con almohadilla sobre la cadera. Empuja con los talones, sube la pelvis y pausa 1 s arriba apretando glúteos. Mentón al pecho.',0],['Curl de predicador',3,'10–12 por brazo','60–90 s','Brazo apoyado completo en el pupitre. Sube sin despegar el codo y baja lento hasta casi estirar, sin rebotar.',0],['Remo en banco',3,'10–12 por lado','60–90 s','Una rodilla y una mano sobre el banco, espalda recta. Lleva el codo hacia la cadera y baja controlado, sin girar el tronco.',2],['Dominadas',3,'6–10 (cerca del fallo)','90–120 s','Agarre un poco más ancho que los hombros. Sube hasta pasar el mentón por la barra y baja con control. Si aún no puedes, usa banda o ayuda.',0],['Levantamiento lateral con mancuernas',3,'12–15','60 s','De pie, codos levemente flexionados. Sube los brazos hasta la altura de los hombros, sin impulso. Mucho menos peso que en los press.',0],['Press de hombro con mancuernas',3,'8–12','90 s','Sentado con la espalda apoyada. Empuja las mancuernas hacia arriba sin arquear la zona lumbar y baja hasta la altura de las orejas.',0],['Press plano con barra',3,'6–10','120 s','Pies firmes en el suelo, omóplatos juntos. Baja la barra al pecho con control y empuja sin despegar la cadera del banco. Pide a alguien que te cuide si subes mucho peso.',0],['Press plano con mancuernas',3,'8–12','90 s','Baja las mancuernas a los lados del pecho con los codos a unos 45°. Sube juntándolas arriba sin chocarlas.',0]];
